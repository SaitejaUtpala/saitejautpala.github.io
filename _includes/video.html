<figure class="update-figure{% if include.size %} figure-{{ include.size }}{% endif %}">
    <video {% if include.autoplay %}autoplay muted loop playsinline{% else %}controls{% endif %} preload="metadata"{% if include.poster %} poster="{{ include.poster | relative_url }}"{% endif %}>
        <source src="{{ include.src | relative_url }}" type="video/{{ include.src | split: '.' | last }}">
        Your browser does not support the video tag. <a href="{{ include.src | relative_url }}">Download the video</a>.
    </video>
    {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
