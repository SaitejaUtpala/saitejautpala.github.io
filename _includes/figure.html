<figure class="update-figure{% if include.size %} figure-{{ include.size }}{% endif %}">
    <a href="{{ include.src | relative_url }}" target="_blank"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | strip_html }}" loading="lazy"></a>
    {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
