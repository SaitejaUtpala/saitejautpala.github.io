title: Saiteja Utpala
url: "https://saitejautpala.github.io"
baseurl: "/"

markdown: kramdown
#ins_logo: "./bits-logo.png"

tracking_id: #

footer: off
footer_url: "https://github.com/ankitsultana"
footer_text: "Page design by Ankit Sultana"

sass:
    style: compressed
    sass_dir: _sass

exclude:
  - README.md
  - LICENSE
  - "Resume_2026 (2).pdf"
  - training_elbow_grid.pdf

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: update
      permalink: /work/:title/

nav:
 - name: "About"
   link: "/"
 - name: "Publications"
   link: "/publications"
 - name: "Resume"
   link: "resume.pdf"
 - name: "Contact"
   link: "contact"
